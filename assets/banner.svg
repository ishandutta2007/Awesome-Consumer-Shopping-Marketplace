<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a10" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="tagGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    
    <!-- Filter for soft subtle neon glow -->
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="orbBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="45" />
    </filter>

    <style>
      .title-text {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 46px;
        letter-spacing: -1px;
      }
      .subtitle-text {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        font-size: 20px;
        fill: #94a3b8;
      }
      .pill-text {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
        fill: #e2e8f0;
      }
      
      /* Subtle dynamic floating ambient animations */
      @keyframes floatOrb1 {
        0%, 100% { transform: translate(0px, 0px) scale(1); }
        50% { transform: translate(40px, -25px) scale(1.1); }
      }
      @keyframes floatOrb2 {
        0%, 100% { transform: translate(0px, 0px) scale(1); }
        50% { transform: translate(-35px, 30px) scale(1.08); }
      }
      @keyframes pulseGrid {
        0%, 100% { opacity: 0.15; }
        50% { opacity: 0.28; }
      }
      @keyframes softFloat {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-6px); }
      }
      @keyframes shimmerBorder {
        0%, 100% { stroke-opacity: 0.4; }
        50% { stroke-opacity: 0.85; }
      }

      .animated-orb1 {
        animation: floatOrb1 12s ease-in-out infinite;
      }
      .animated-orb2 {
        animation: floatOrb2 14s ease-in-out infinite;
      }
      .animated-grid {
        animation: pulseGrid 8s ease-in-out infinite;
      }
      .animated-pill {
        animation: softFloat 6s ease-in-out infinite;
      }
      .animated-frame {
        animation: shimmerBorder 5s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Deep modern backdrop -->
  <rect width="1200" height="420" rx="20" fill="url(#bgGrad)" />

  <!-- Dynamic ambient light orbs in background -->
  <g opacity="0.35">
    <circle class="animated-orb1" cx="220" cy="110" r="130" fill="#38bdf8" filter="url(#orbBlur)" />
    <circle class="animated-orb2" cx="980" cy="310" r="150" fill="#a855f7" filter="url(#orbBlur)" />
    <circle class="animated-orb1" cx="620" cy="210" r="110" fill="#10b981" filter="url(#orbBlur)" />
  </g>

  <!-- High-tech perspective grid overlay -->
  <g class="animated-grid" stroke="#64748b" stroke-width="0.7" opacity="0.18">
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="350" x2="1200" y2="350" />
    
    <line x1="150" y1="0" x2="150" y2="420" />
    <line x1="300" y1="0" x2="300" y2="420" />
    <line x1="450" y1="0" x2="450" y2="420" />
    <line x1="600" y1="0" x2="600" y2="420" />
    <line x1="750" y1="0" x2="750" y2="420" />
    <line x1="900" y1="0" x2="900" y2="420" />
    <line x1="1050" y1="0" x2="1050" y2="420" />
  </g>

  <!-- Subtle border outline -->
  <rect class="animated-frame" x="2" y="2" width="1196" height="416" rx="18" fill="none" stroke="url(#accentGrad)" stroke-width="1.8" />

  <!-- Center Card Backdrop to keep foreground text 100% readable and pristine -->
  <rect x="70" y="55" width="1060" height="310" rx="16" fill="#0f172a" fill-opacity="0.82" stroke="#334155" stroke-width="1" />

  <!-- Category Tag / Badge -->
  <g transform="translate(470, 85)">
    <rect x="0" y="0" width="260" height="32" rx="16" fill="#1e293b" stroke="#3b82f6" stroke-width="1.2" />
    <circle cx="16" cy="16" r="5" fill="#38bdf8" />
    <text x="32" y="21" class="pill-text" fill="#38bdf8" font-size="12" letter-spacing="0.8">CURATED OPEN COMMERCE ECOSYSTEM</text>
  </g>

  <!-- Foreground Title -->
  <g transform="translate(600, 165)">
    <text text-anchor="middle" class="title-text" fill="url(#accentGrad)">
      Consumer Shopping Marketplace
    </text>
  </g>

  <!-- Foreground Subtitle -->
  <g transform="translate(600, 205)">
    <text text-anchor="middle" class="subtitle-text">
      The Ultimate Hub for Product Discovery, Cashback Protocols, Multi-Vendor Platforms &amp; Shopping Assistants
    </text>
  </g>

  <!-- Dynamic Feature Badges / Pills (Layered below title in z-space and spaced cleanly) -->
  <g class="animated-pill" transform="translate(130, 260)">
    <!-- Pill 1: Headless Marketplaces -->
    <g transform="translate(0, 0)">
      <rect width="210" height="42" rx="10" fill="#1e293b" fill-opacity="0.9" stroke="#475569" stroke-width="1" />
      <text x="22" y="26" font-size="17">🛍️</text>
      <text x="50" y="26" class="pill-text">Multi-Vendor Mall</text>
    </g>

    <!-- Pill 2: Cashback & Rewards -->
    <g transform="translate(230, 0)">
      <rect width="210" height="42" rx="10" fill="#1e293b" fill-opacity="0.9" stroke="#475569" stroke-width="1" />
      <text x="22" y="26" font-size="17">💰</text>
      <text x="50" y="26" class="pill-text">Cashback &amp; Rewards</text>
    </g>

    <!-- Pill 3: Coupon Extensions -->
    <g transform="translate(460, 0)">
      <rect width="220" height="42" rx="10" fill="#1e293b" fill-opacity="0.9" stroke="#475569" stroke-width="1" />
      <text x="22" y="26" font-size="17">⚡</text>
      <text x="50" y="26" class="pill-text">Browser Extensions</text>
    </g>

    <!-- Pill 4: Agentic Commerce -->
    <g transform="translate(700, 0)">
      <rect width="230" height="42" rx="10" fill="#1e293b" fill-opacity="0.9" stroke="#475569" stroke-width="1" />
      <text x="22" y="26" font-size="17">🤖</text>
      <text x="50" y="26" class="pill-text">AI Shopping Assistants</text>
    </g>
  </g>

  <!-- Bottom Accent Highlights -->
  <line x1="250" y1="335" x2="950" y2="335" stroke="url(#accentGrad)" stroke-width="1.2" opacity="0.4" />
</svg>
